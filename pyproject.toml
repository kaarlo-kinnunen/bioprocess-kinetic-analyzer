[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioprocess-kinetic-analyzer"
version = "0.1.0"
description = "Kinetic analysis and PDF reporting for Knallgas gas-fermentation bioreactor runs"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "reportlab",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
bioprocess = "bioprocess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]